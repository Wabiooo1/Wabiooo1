<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;"/>
      <stop offset="100%" style="stop-color:#B8860B;"/>
    </linearGradient>
    <linearGradient id="wood-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#855E42;"/>
      <stop offset="100%" style="stop-color:#5C3D0E;"/>
    </linearGradient>
  </defs>
  
  <!-- Outer wood ring -->
  <circle cx="50" cy="50" r="48" fill="url(#wood-grad)" stroke="#442d0a" stroke-width="4"/>
  
  <!-- Pockets area -->
  <circle cx="50" cy="50" r="40" fill="#111"/>
  
  <!-- Pockets (decorative) -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="2">
    <path d="M50 10 V 20" /> <path d="M90 50 H 80" />
    <path d="M50 90 V 80" /> <path d="M10 50 H 20" />
    <path d="M78.2 21.8 L 71.1 28.9" /> <path d="M21.8 78.2 L 28.9 71.1" />
    <path d="M21.8 21.8 L 28.9 28.9" /> <path d="M78.2 78.2 L 71.1 71.1" />
  </g>
  
  <!-- Center piece -->
  <circle cx="50" cy="50" r="15" fill="url(#gold-grad)" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Ball -->
  <circle cx="25" cy="25" r="4" fill="white" stroke="grey" stroke-width="1"/>
</svg>