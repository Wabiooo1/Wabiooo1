    <div class="betting-area">
        <div class="roulette-controls">
            <div class="chip-selection">
                <span class="chip-label">Ficha:</span>
                <button class="chip" data-value="1">$1</button>
                <button class="chip" data-value="5">$5</button>
                <button class="chip" data-value="10">$10</button>
                <button class="chip" data-value="25">$25</button>
                <button class="chip" data-value="100">$100</button>
            </div>
            <div class="total-bet-display">
                Apuesta Total: <span id="total-bet">$0.00</span>
            </div>
            <div class="action-buttons">
                <button id="clear-bets" class="btn alt">Limpiar</button>
                <button id="spin-wheel" class="btn big">GIRAR</button>
            </div>
        </div>
        <div class="roulette-table-container">
            <div class="roulette-table">
                <div class="bet-option zero" data-type="number" data-value="0">0</div>
                <div class="numbers-grid"></div>
                <div class="side-bets">
                    <div class="bet-option" data-type="dozen" data-value="1">1st 12</div>
                    <div class="bet-option" data-type="dozen" data-value="2">2nd 12</div>
                    <div class="bet-option" data-type="dozen" data-value="3">3rd 12</div>
                    <div class="bet-option" data-type="simple" data-value="1-18">1-18</div>
                    <div class="bet-option" data-type="simple" data-value="even">PAR</div>
                    <div class="bet-option red" data-type="color" data-value="red"></div>
                    <div class="bet-option black" data-type="color" data-value="black"></div>
                    <div class="bet-option" data-type="simple" data-value="odd">IMPAR</div>
                    <div class="bet-option" data-type="simple" data-value="19-36">19-36</div>
                </div>
                 <div class="column-bets">
                    <div class="bet-option" data-type="column" data-value="1">2-1</div>
                    <div class="bet-option" data-type="column" data-value="2">2-1</div>
                    <div class="bet-option" data-type="column" data-value="3">2-1</div>
                </div>
            </div>
        </div>

<audio id="lose-sound" src="{{ url_for('static', filename='audio/lose.wav') }}" preload="auto"></audio>
