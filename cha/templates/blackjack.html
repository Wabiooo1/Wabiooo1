{% extends "layout.html" %}

{% block title %}Blackjack{% endblock %}

{% block main %}
<div class="blackjack-table">
    <img src="{{ url_for('static', filename='img/shoe.jpg') }}" alt="Zapato de cartas" class="shoe">
    <div class="dealer-hand">
        <h3>Dealer</h3>
        <div class="cards"></div>
    </div>
    <div class="player-hand">
        <h3>Jugador</h3>
        <div class="cards"></div>
    </div>
    <!-- Botones de acciones (expande según tu lógica existente) -->
    <button id="deal">Repartir</button>
    <button id="hit" disabled>Hit</button>
    <button id="stand" disabled>Stand</button>
    <!-- Agrega más elementos como saldo, apuestas, etc., de tu versión original -->
</div>
<script src="{{ url_for('static', filename='js/blackjack.js') }}"></script>
{% endblock %}
