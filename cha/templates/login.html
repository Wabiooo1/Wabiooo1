{% extends 'layout.html' %}
{% block content %}
<div class="auth-card">
  <h2>Iniciar sesión</h2>
  <form method="post">
    <label for="username">Usuario</label><input id="username" name="username" required>
    <label for="password">Contraseña</label><input id="password" name="password" type="password" required>
    <button class="btn" type="submit">Entrar</button>
  </form>
  <div class="auth-switch">
    ¿No tienes una cuenta? <a href="{{ url_for('register') }}">Regístrate aquí</a>
  </div>
</div>
{% endblock %}
