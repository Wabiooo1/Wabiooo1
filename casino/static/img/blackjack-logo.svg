<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 150">
  <defs>
    <!-- Degradado dorado -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFC000"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <!-- Degradado negro -->
    <linearGradient id="blackFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <!-- Brillo -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo circular -->
  <circle cx="125" cy="75" r="70" fill="url(#blackFade)" stroke="url(#gold)" stroke-width="4"/>

  <!-- Carta A -->
  <g transform="rotate(-12 100 50)">
    <rect x="80" y="25" width="40" height="55" rx="4" ry="4" fill="white" stroke="#000" stroke-width="2"/>
    <text x="100" y="55" font-size="18" font-family="serif" font-weight="bold" fill="#000" text-anchor="middle" alignment-baseline="middle">
      A♠
    </text>
  </g>

  <!-- Carta K -->
  <g transform="rotate(8 125 45)">
    <rect x="105" y="20" width="40" height="55" rx="4" ry="4" fill="white" stroke="#000" stroke-width="2"/>
    <text x="125" y="50" font-size="18" font-family="serif" font-weight="bold" fill="#000" text-anchor="middle" alignment-baseline="middle">
      K♠
    </text>
  </g>

  <!-- Texto BLACKJACK sin borde -->
  <text x="125" y="120" font-size="26" font-family="serif" font-weight="bold" fill="url(#gold)" text-anchor="middle" filter="url(#glow)">
    BLACKJACK
  </text>

  <!-- Destellos -->
  <circle cx="180" cy="35" r="3" fill="#fff"/>
  <circle cx="60" cy="100" r="2" fill="#fff"/>
</svg>
