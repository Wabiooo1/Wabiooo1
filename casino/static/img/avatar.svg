<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Gradiente dorado -->
    <linearGradient id="goldBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffeb99"/>
      <stop offset="40%" stop-color="#ffd24d"/>
      <stop offset="100%" stop-color="#b38600"/>
    </linearGradient>

    <!-- Fondo oscuro -->
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#222"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>

    <!-- Brillo interior -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Sombra -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Círculo exterior dorado -->
  <circle cx="50" cy="50" r="48" fill="url(#goldBorder)" stroke="#7a5a00" stroke-width="2" filter="url(#shadow)"/>

  <!-- Fondo interior -->
  <circle cx="50" cy="50" r="42" fill="url(#darkBg)"/>

  <!-- Silueta de usuario -->
  <path d="M50 30a12 12 0 1 1 0 24a12 12 0 1 1 0-24zm0 28c-11 0-22 5.5-22 14v6h44v-6c0-8.5-11-14-22-14z"
        fill="url(#goldBorder)"/>

  <!-- Brillo -->
  <circle cx="50" cy="50" r="42" fill="url(#innerGlow)"/>
</svg>
