<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300">
  <defs>
    <!-- Borde dorado -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffefba"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>

    <!-- Sombra -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Carta -->
  <rect x="10" y="10" width="180" height="280" rx="20" ry="20" 
        fill="white" stroke="url(#gold)" stroke-width="8" filter="url(#shadow)"/>

  <!-- Texto central -->
  <text x="100" y="150" font-size="28" font-weight="bold" text-anchor="middle" 
        font-family="serif" fill="#000">
    BLACKJACK
  </text>

  <!-- Símbolos en esquinas -->
  <text x="25" y="40" font-size="28" font-weight="bold" fill="black">♠</text>
  <text x="160" y="40" font-size="28" font-weight="bold" fill="red">♥</text>
  <text x="25" y="270" font-size="28" font-weight="bold" fill="red">♥</text>
  <text x="160" y="270" font-size="28" font-weight="bold" fill="black">♠</text>
</svg>
